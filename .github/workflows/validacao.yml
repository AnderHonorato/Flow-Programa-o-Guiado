name: Validar e compilar Flow

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validacao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-android:
    name: Web, testes e APK de depuracao
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/provisionar-python.mjs
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verificar fluxos web em navegador real
        run: |
          npm run preview --workspace aplicativos/web -- --host 127.0.0.1 --port 4173 > /tmp/flow-preview.log 2>&1 &
          for tentativa in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ > /dev/null && break
            sleep 1
          done
          npm run test:e2e
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Instalar plataforma Android
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0' 'build-tools;35.0.0'
      - name: Compilar e verificar Android
        run: bash scripts/android-compilar.sh --sem-web
      - name: Guardar APK, checksum e relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Flow-0.1.0-debug
          if-no-files-found: warn
          retention-days: 14
          path: |
            artefatos/
            aplicativos/android/app/build/reports/lint-results-debug.html
            aplicativos/web/dist/
            playwright-report/
            test-results/
  servidor:
    name: API e permissoes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: servidor/requirements*.txt
      - run: python -m pip install -r servidor/requirements-desenvolvimento.txt
      - run: python -m pytest servidor/testes -q
