name: APK — compilação em contêiner Android
on:
  push:
    branches: [distribuicao/v0.2.0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compilar:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/android-sdk:35
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar ambiente de compilação
        shell: bash
        run: |
          apt-get update
          apt-get install -y python3 python3-pip git curl unzip
          echo "ANDROID_HOME=${ANDROID_HOME:-/opt/android-sdk}" >> "$GITHUB_ENV"
          java -version
          node --version
      - name: Instalar dependências do projeto
        run: npm ci
      - name: Compilar web e Android
        shell: bash
        run: |
          bash scripts/android-compilar.sh
      - name: Verificar assinatura e estrutura do APK
        shell: bash
        run: |
          set -euo pipefail
          APK="artefatos/Flow-Programacao-Guiada-0.2.0-debug.apk"
          test -s "$APK"
          SDK="${ANDROID_HOME:-/opt/android-sdk}"
          APKSIGNER="$(find "$SDK/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          AAPT="$(find "$SDK/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" > artefatos/android-manifesto.txt
          sed -n '1,12p' artefatos/android-manifesto.txt
          unzip -t "$APK" | tail -n 2
      - name: Publicar APK para download
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Flow-APK-novo-icone
          path: artefatos/*.apk
          if-no-files-found: error
          retention-days: 30
