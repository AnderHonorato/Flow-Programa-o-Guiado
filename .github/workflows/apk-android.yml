name: Compilar APK Android isoladamente

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'aplicativos/android/**'
      - 'aplicativos/web/**'
      - 'scripts/android-*'
      - 'testes/android-*'
      - 'scripts/testar-instalacao-emulador.sh'
      - 'scripts/provisionar-python.mjs'
      - 'package*.json'
      - '.github/workflows/apk-android.yml'

permissions:
  contents: read

jobs:
  apk:
    name: APK de diagnostico, assinatura e metadados
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Preparar plataforma e ferramentas Android
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Instalar dependencias travadas
        run: npm ci
      - name: Preparar Python offline e compilar interface
        run: |
          node scripts/provisionar-python.mjs
          npm run build
      - name: Sincronizar aplicativo Android
        working-directory: aplicativos/web
        run: npx --no-install cap sync android
      - name: Compilar APK de depuracao
        working-directory: aplicativos/android
        run: ./gradlew --no-daemon --console=plain assembleDebug
      - name: Verificar APK, assinatura e identificador
        run: |
          set -euo pipefail
          mkdir -p artefatos/android
          apk=aplicativos/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          cp "$apk" artefatos/android/Flow-Programacao-Guiada-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > artefatos/android/assinatura.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > artefatos/android/metadados.txt
          grep -q "package: name='br.com.ander.flow'" artefatos/android/metadados.txt
          # A versão é derivada do Gradle, evitando falsos gates após atualização.
          versao_codigo=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' aplicativos/android/app/build.gradle | head -1)
          versao_nome=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' aplicativos/android/app/build.gradle | head -1)
          test -n "$versao_codigo" && test -n "$versao_nome"
          grep -Fq "versionCode='$versao_codigo'" artefatos/android/metadados.txt
          grep -Fq "versionName='$versao_nome'" artefatos/android/metadados.txt
          printf 'versao=%s\nversionCode=%s\n' "$versao_nome" "$versao_codigo" > artefatos/android/versao.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --min-sdk-version 23 "$apk"
          (cd artefatos/android && sha256sum Flow-Programacao-Guiada-debug.apk > Flow-Programacao-Guiada-debug.apk.sha256)
          cat artefatos/android/Flow-Programacao-Guiada-debug.apk.sha256
      - name: Conferir metadados e certificado reais do APK
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_android_conferir_apk.py'
          apk=artefatos/android/Flow-Programacao-Guiada-debug.apk
          python3 scripts/android-conferir-apk.py "$apk" \
            --gradle aplicativos/android/app/build.gradle \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            > artefatos/android/metadados-assinatura.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          dados = json.loads(Path('artefatos/android/metadados-assinatura.json').read_text())
          assert dados['packageId'] == 'br.com.ander.flow'
          assert dados['compatibilidadeGalaxyA35'] == 'não verificada'
          assert len(dados['apkSha256']) == 64
          assert len(dados['certificadoSha256']) == 64
          print('Gate de assinatura, pacote, versão e SHA-256 aprovado; A35 físico não validado.')
          PY
      - name: Obter codigo da versao anterior 0.6.0
        uses: actions/checkout@v4
        with:
          ref: engenharia/emulador-preservacao-dados-gate
          path: versao-anterior
          persist-credentials: false
      - name: Compilar APK anterior com a mesma chave de teste
        run: |
          set -euo pipefail
          cd versao-anterior
          npm ci
          node scripts/provisionar-python.mjs
          npm run build
          (cd aplicativos/web && npx --no-install cap sync android)
          (cd aplicativos/android && ./gradlew --no-daemon --console=plain assembleDebug)
          cp aplicativos/android/app/build/outputs/apk/debug/app-debug.apk ../artefatos/android/Flow-Programacao-Guiada-anterior-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs ../artefatos/android/Flow-Programacao-Guiada-anterior-debug.apk > ../artefatos/android/assinatura-anterior.txt
          (cd ../artefatos/android && sha256sum Flow-Programacao-Guiada-anterior-debug.apk > Flow-Programacao-Guiada-anterior-debug.apk.sha256)
      - name: Validar atualização dos dois APKs antes do emulador
        run: |
          node --test testes/android-preflight-atualizacao.test.mjs
          node scripts/android-preflight-atualizacao.mjs \
            artefatos/android/Flow-Programacao-Guiada-anterior-debug.apk \
            artefatos/android/Flow-Programacao-Guiada-debug.apk \
            artefatos/android/preflight-atualizacao.json
      - name: Disponibilizar APK e evidencias sem publicar producao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-apk-diagnostico-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: warn
          path: artefatos/android/

  instalacao-emulador:
    name: Instalar e abrir APK em Android 15
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: flow-apk-diagnostico-${{ github.run_number }}
          path: artefatos/android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar ferramentas Android no runner do emulador
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Verificar sdkmanager e SDK isolado
        shell: bash
        run: |
          set -euo pipefail
          command -v sdkmanager
          test -n "${ANDROID_HOME:-}"
          sdkmanager --version
      - name: Ativar aceleracao KVM para emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Provisionar imagem Android 15 com tentativas controladas
        shell: bash
        run: |
          set -euo pipefail
          # A rede do runner pode entregar um ZIP incompleto da imagem do sistema.
          # O emulador só inicia após o SDK estar integralmente instalado.
          pacote='system-images;android-35;google_apis;x86_64'
          for tentativa in 1 2 3; do
            echo "Provisionando imagem Android 15 (tentativa ${tentativa}/3)"
            if sdkmanager --install "$pacote" --channel=0; then
              if test -f "$ANDROID_HOME/system-images/android-35/google_apis/x86_64/system.img"; then
                echo 'Imagem Android 15 instalada e verificada'
                exit 0
              fi
            fi
            if [ "$tentativa" -lt 3 ]; then
              sleep $((tentativa * 15))
            fi
          done
          echo 'Falha ao obter imagem Android 15 após três tentativas' >&2
          exit 1
      - name: Instalar APK e abrir interface em emulador
        uses: reactivecircus/android-emulator-runner@v2.34.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/testar-instalacao-emulador.sh artefatos/android/Flow-Programacao-Guiada-debug.apk artefatos/emulador artefatos/android/Flow-Programacao-Guiada-anterior-debug.apk
      - name: Guardar evidencias de instalacao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-instalacao-emulador-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: warn
          path: artefatos/emulador/
