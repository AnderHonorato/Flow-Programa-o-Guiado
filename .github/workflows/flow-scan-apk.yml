name: APK Flow Scan
on:
  push:
    branches: [flow-scan-digitalizador]
    paths:
      - 'flow-scan/**'
      - '.github/workflows/flow-scan-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Preparar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Validar JavaScript
        run: node --check flow-scan/app/src/main/assets/app.js
      - name: Compilar APK de instalacao
        working-directory: flow-scan
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Flow-Scan-APK
          path: flow-scan/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Empacotar codigo fonte
        run: zip -qr Flow-Scan-codigo.zip flow-scan .github/workflows/flow-scan-apk.yml
      - uses: actions/upload-artifact@v4
        with:
          name: Flow-Scan-Codigo
          path: Flow-Scan-codigo.zip
          if-no-files-found: error
